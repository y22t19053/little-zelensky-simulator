<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-label="原创矢量插画：战时总统办公室的一角，清晨的窗外是基辅天际线，桌上是文件和折叠的国旗">
  <title>战时办公室 · 清晨</title>
  <desc>原创编辑插画，不是历史照片。平面矢量风格，不作写实描绘。</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171c15"/>
      <stop offset="1" stop-color="#10140e"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a22"/>
      <stop offset="0.55" stop-color="#3c3f2f"/>
      <stop offset="1" stop-color="#7a6f4e"/>
    </linearGradient>
    <radialGradient id="dawn" cx="0.62" cy="0.72" r="0.55">
      <stop offset="0" stop-color="#d8b978" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#a08c5a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7a6f4e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e6cd97" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c9a869" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242a20"/>
      <stop offset="1" stop-color="#14180f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2d8bf"/>
      <stop offset="1" stop-color="#cdc2a6"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d09" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#0b0d09" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0d09" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="fibre" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 6h12" stroke="#ffffff" stroke-opacity="0.014" stroke-width="1"/>
      <path d="M6 0v12" stroke="#000000" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="640" fill="url(#wall)"/>
  <rect width="1600" height="640" fill="url(#fibre)"/>

  <!-- 窗户 -->
  <g>
    <rect x="118" y="58" width="864" height="416" fill="url(#sky)"/>
    <rect x="118" y="58" width="864" height="416" fill="url(#dawn)"/>

    <!-- 晨光 -->
    <circle cx="806" cy="332" r="52" fill="#e5c88b" opacity="0.55"/>
    <circle cx="806" cy="332" r="30" fill="#f0d79d" opacity="0.75"/>

    <!-- 远处城市轮廓 -->
    <g fill="#1b2018" opacity="0.92">
      <rect x="150" y="352" width="74" height="122"/>
      <rect x="228" y="330" width="52" height="144"/>
      <rect x="286" y="366" width="96" height="108"/>
      <rect x="392" y="318" width="40" height="156"/>
      <rect x="438" y="356" width="88" height="118"/>
      <rect x="534" y="336" width="64" height="138"/>
      <rect x="604" y="372" width="120" height="102"/>
      <rect x="730" y="344" width="58" height="130"/>
      <rect x="796" y="360" width="104" height="114"/>
      <rect x="906" y="330" width="66" height="144"/>
    </g>

    <!-- 钟楼与穹顶 -->
    <g fill="#171b14">
      <path d="M300 268 l26 -34 l26 34 v106 h-52 z"/>
      <path d="M326 234 l0 -22 l6 0 l0 22 z"/>
      <path d="M520 322 c22 -30 62 -30 84 0 v82 h-84 z"/>
      <path d="M562 292 l0 -16 l5 0 l0 16 z"/>
      <circle cx="562" cy="330" r="7" fill="#0f120c"/>
    </g>

    <!-- 烟柱：抽象示意，不表现具体事件 -->
    <g opacity="0.5">
      <path d="M700 400 C 684 350 700 300 676 254 C 662 226 672 200 690 186 C 686 214 700 232 706 258 C 720 300 700 350 722 400 Z" fill="#2a2f26"/>
      <path d="M742 400 C 732 358 748 322 736 288 C 728 264 736 246 748 236 C 748 262 758 282 760 306 C 764 344 752 372 764 400 Z" fill="#252b23" opacity="0.8"/>
    </g>

    <!-- 窗框 -->
    <g fill="none" stroke="#39402f" stroke-width="12">
      <rect x="118" y="58" width="864" height="416"/>
      <path d="M406 58 V474 M694 58 V474 M118 268 H982"/>
    </g>
    <rect x="104" y="56" width="16" height="420" fill="#2b3227"/>
    <rect x="980" y="56" width="16" height="420" fill="#2b3227"/>

    <!-- 窗台沙袋 -->
    <g fill="#4b5340" stroke="#5b644c" stroke-width="2">
      <path d="M120 424 q34 -22 68 0 q-6 26 -34 26 q-28 0 -34 -26 z"/>
      <path d="M188 424 q34 -22 68 0 q-6 26 -34 26 q-28 0 -34 -26 z"/>
      <path d="M154 400 q34 -22 68 0 q-6 26 -34 26 q-28 0 -34 -26 z"/>
    </g>
  </g>

  <!-- 窗帘 -->
  <g>
    <path d="M996 44 C1032 150 1014 320 1036 486 L1150 486 C1128 320 1146 150 1110 44 Z" fill="#1b2118"/>
    <path d="M1032 44 C1060 156 1042 322 1060 486" fill="none" stroke="#2f372c" stroke-width="4" opacity="0.9"/>
    <path d="M1072 44 C1096 158 1080 322 1096 486" fill="none" stroke="#2a3127" stroke-width="4" opacity="0.8"/>
    <path d="M1110 44 C1140 150 1124 320 1150 486" fill="none" stroke="#0e120c" stroke-width="6" opacity="0.55"/>
  </g>

  <!-- 桌面 -->
  <rect x="0" y="452" width="1600" height="188" fill="url(#desk)"/>
  <rect x="0" y="452" width="1600" height="3" fill="#3a4235" opacity="0.7"/>
  <rect x="0" y="452" width="1600" height="188" fill="url(#fibre)"/>
  <!-- 窗光落在桌面上 -->
  <rect x="0" y="455" width="1600" height="16" fill="#e6cd97" opacity="0.07"/>
  <path d="M120 470 L1000 470 L940 560 L60 560 Z" fill="#e6cd97" opacity="0.035"/>
  <!-- 左侧档案夹 -->
  <g transform="rotate(-1 330 590)">
    <rect x="330" y="556" width="236" height="76" rx="3" fill="#2b3227" stroke="#414a38" stroke-width="2"/>
    <rect x="352" y="578" width="190" height="34" fill="#5b5236" opacity="0.75"/>
    <path d="M330 568 h236" stroke="#4d5544" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- 台灯光 -->
  <ellipse cx="1300" cy="470" rx="300" ry="150" fill="url(#lampGlow)"/>

  <!-- 文件 -->
  <g>
    <g transform="rotate(-3 1200 500)">
      <rect x="1040" y="440" width="290" height="176" fill="#b6a98c" opacity="0.9"/>
      <rect x="1030" y="432" width="290" height="176" fill="url(#paper)"/>
      <g stroke="#a89c82" stroke-width="3" opacity="0.85">
        <path d="M1058 466 H1260 M1058 490 H1292 M1058 514 H1240 M1058 538 H1286 M1058 562 H1214"/>
      </g>
      <rect x="1236" y="452" width="52" height="22" fill="none" stroke="#8c4a3a" stroke-width="2" opacity="0.75"/>
    </g>
    <g transform="rotate(4 900 520)">
      <rect x="836" y="470" width="214" height="140" fill="url(#paper)" opacity="0.96"/>
      <g stroke="#a89c82" stroke-width="3" opacity="0.7">
        <path d="M856 496 H1012 M856 518 H1026 M856 540 H980 M856 562 H1010"/>
      </g>
    </g>
  </g>

  <!-- 折叠的国旗 -->
  <g transform="rotate(-2 210 520)">
    <rect x="120" y="486" width="196" height="34" fill="#4f7ba0"/>
    <rect x="120" y="520" width="196" height="34" fill="#c9a849"/>
    <rect x="120" y="486" width="196" height="68" fill="none" stroke="#2a2f26" stroke-width="2" opacity="0.5"/>
    <path d="M216 486 V554" stroke="#2a2f26" stroke-width="2" opacity="0.35"/>
  </g>

  <!-- 电话与杯子 -->
  <g>
    <g transform="translate(452 500)">
      <rect x="0" y="16" width="86" height="34" rx="4" fill="#31382b" stroke="#474f3c" stroke-width="2"/>
      <rect x="12" y="24" width="62" height="18" rx="2" fill="#242a20"/>
      <path d="M-2 2 q10 -14 26 -8 l-6 18 q-12 -6 -14 4 z" fill="#3a4235" stroke="#4d5544" stroke-width="2"/>
      <path d="M70 2 q16 -6 20 8 l-14 8 q-6 -12 -12 -8 z" fill="#3a4235" stroke="#4d5544" stroke-width="2"/>
      <path d="M22 4 q26 -12 50 4" fill="none" stroke="#4d5544" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(690 496)">
      <path d="M2 0 h48 v44 q0 10 -24 10 q-24 0 -24 -10 z" fill="#3a4235" stroke="#4d5544" stroke-width="2"/>
      <ellipse cx="26" cy="0" rx="24" ry="8" fill="#4d5544"/>
      <ellipse cx="26" cy="2" rx="19" ry="6" fill="#1a1f17"/>
      <path d="M50 12 q16 4 14 16 q-2 12 -16 12" fill="none" stroke="#4d5544" stroke-width="6"/>
    </g>
    <ellipse cx="716" cy="556" rx="42" ry="9" fill="#000000" opacity="0.28"/>
  </g>

  <!-- 笔 -->
  <path d="M900 590 l120 -22 l3 10 l-120 22 z" fill="#c9a869" opacity="0.85"/>

  <rect width="1600" height="640" fill="url(#vignette)"/>
</svg>
