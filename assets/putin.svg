<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">长桌尽头的普京</title>
  <desc id="desc">冷灰色调的克制政治漫画。普京独自坐在空旷大厅的长桌远端，人物很小，桌面透视线向观者延伸，强调距离与疏离感。</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343b40"/>
      <stop offset="1" stop-color="#1e2428"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#687076"/>
      <stop offset="0.45" stop-color="#454d52"/>
      <stop offset="1" stop-color="#272e32"/>
    </linearGradient>
    <linearGradient id="tableEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30383d"/>
      <stop offset="1" stop-color="#151a1d"/>
    </linearGradient>
    <radialGradient id="coldLight" cx="50%" cy="30%" r="62%">
      <stop offset="0" stop-color="#aab2b5" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#aab2b5" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="1200" height="900" rx="24"/>
    </clipPath>
  </defs>
