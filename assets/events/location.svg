  <text x="42" y="84" class="mono muted" font-size="12" letter-spacing="2">PRESENCE / CONTINUITY / EXPOSURE</text>
  <rect x="1068" y="38" width="90" height="31" fill="none" stroke="#b99a60"/><text x="1082" y="59" class="mono amber" font-size="13">02 / 07</text>
  <path d="M42 103H1158" stroke="#555c4b"/>
