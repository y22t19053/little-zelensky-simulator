<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">总统在哪里：公开存在与指挥暴露的政治处境</title>
  <desc id="desc">原创政治编辑插画。中央为办公室内的总统剪影和一台摄像机，左右档案卡分别呈现留在班科夫街的公开可见性与转移方案的不确定性，不暗示任一选择的历史结果。</desc>
