    <pattern id="grain" width="41" height="35" patternUnits="userSpaceOnUse"><circle cx="9" cy="8" r=".8" fill="#d0c398" fill-opacity=".08"/><path d="M27 27h4" stroke="#d0c398" stroke-opacity=".05"/></pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-32)"><path d="M0 0V8" stroke="#171b14" stroke-opacity=".2" stroke-width="2"/></pattern>
    <style>.serif{font-family:Georgia,'SimSun',serif}.sans{font-family:Arial,'Microsoft YaHei',sans-serif}.mono{font-family:Consolas,monospace}.paper{fill:#c8bc99}.amber{fill:#c9a563}.muted{fill:#969a88}.dark{fill:#171a13}.line{fill:none;stroke:#7f8772;stroke-width:2}</style>
  </defs>
