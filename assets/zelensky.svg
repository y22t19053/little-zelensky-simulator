  <title id="title">疲惫而坚定的泽连斯基肖像</title>
  <desc id="desc">克制严肃的政治漫画风半身像。泽连斯基穿军绿色抓绒外套，眼下带着疲态，目光直视前方；深灰背景与低饱和琥珀色光晕衬托面部。</desc>
