<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">2022年2月24日，总统办公室与多方向入侵局势</title>
  <desc id="desc">原创政治漫画与档案拼贴。左侧是办公室内的人物、电话与文件，右侧以简化地图和多向箭头表示全面入侵，不表示实时前线或兵力。</desc>
